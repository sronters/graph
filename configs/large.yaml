schema_version: "1.0"
backend: igraph
condition_mode: conservative
analysis:
  maximum_depth: 8
  top_k_per_source_target: 5
  top_k_per_source: 10
  global_path_cap: 10000
  criticality_threshold: 0.70
  include_dormant: false
  include_disabled: false
storage:
  data_root: data
  artifact_root: artifacts
  database_path: artifacts/graphtrust.duckdb
runtime:
  workers: 1
  deterministic: true
  json_logs: false
