name: docker-verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-build-start-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build --pull
      - name: Start GraphTrust
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Verify API health contract
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/health | tee api-health.json
          python -c "import json; p=json.load(open('api-health.json')); assert p['status']=='ok' and p['version']"
      - name: Verify frontend response
        run: curl --fail --show-error --silent --output /dev/null http://127.0.0.1:8080/
      - name: Capture container state
        if: always()
        run: docker compose ps --all
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop GraphTrust
        if: always()
        run: docker compose down --volumes --remove-orphans
