<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Exact path recall by planted path depth</title>
  <desc id="desc">GraphTrust, untyped traversal and native scope recall at planted depths two, three and four across 15 independent organizations.</desc>
  <rect width="1200" height="760" fill="#07111f"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Exact-path recall declines with planted path depth</text>
  <text x="70" y="110" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">Analysis depth 6 · 15 independent organizations · direct and privileged-only recall = 0 at every planted depth</text>
  <line x1="130" y1="630" x2="1110" y2="630" stroke="#334155" stroke-width="2"/>
  <line x1="130" y1="160" x2="130" y2="630" stroke="#334155" stroke-width="2"/>
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8">
    <line x1="130" y1="512.5" x2="1110" y2="512.5"/><line x1="130" y1="395" x2="1110" y2="395"/>
    <line x1="130" y1="277.5" x2="1110" y2="277.5"/><line x1="130" y1="160" x2="1110" y2="160"/>
  </g>
  <g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">
    <text x="92" y="636">0%</text><text x="82" y="518">25%</text><text x="82" y="401">50%</text><text x="82" y="284">75%</text><text x="74" y="166">100%</text>
    <text x="280" y="673" text-anchor="middle">Depth 2</text><text x="620" y="673" text-anchor="middle">Depth 3</text><text x="960" y="673" text-anchor="middle">Depth 4</text>
  </g>
  <text x="45" y="410" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17" transform="rotate(-90 45 410)">Mean exact-path recall</text>
  <polyline points="280,200 620,348 960,473" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="280,200 620,348 960,317" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="280,523 620,505 960,630" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#22c55e" stroke="#07111f" stroke-width="4"><circle cx="280" cy="200" r="11"/><circle cx="620" cy="348" r="11"/><circle cx="960" cy="473" r="11"/></g>
  <g fill="#38bdf8" stroke="#07111f" stroke-width="4"><rect x="269" y="189" width="22" height="22" rx="4"/><rect x="609" y="337" width="22" height="22" rx="4"/><rect x="949" y="306" width="22" height="22" rx="4"/></g>
  <g fill="#a78bfa" stroke="#07111f" stroke-width="4"><polygon points="280,510 293,532 267,532"/><polygon points="620,492 633,514 607,514"/><polygon points="960,617 973,639 947,639"/></g>
  <g font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">
    <text x="280" y="178" text-anchor="middle" fill="#86efac">91.43%</text><text x="620" y="326" text-anchor="middle" fill="#86efac">60.00%</text><text x="960" y="451" text-anchor="middle" fill="#86efac">33.33%</text>
    <text x="960" y="295" text-anchor="middle" fill="#7dd3fc">66.67%</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="18">
    <line x1="770" y1="92" x2="810" y2="92" stroke="#22c55e" stroke-width="7"/><text x="820" y="99" fill="#f8fafc">GraphTrust</text>
    <line x1="940" y1="92" x2="980" y2="92" stroke="#38bdf8" stroke-width="7"/><text x="990" y="99" fill="#f8fafc">Untyped</text>
    <line x1="770" y1="125" x2="810" y2="125" stroke="#a78bfa" stroke-width="7"/><text x="820" y="132" fill="#f8fafc">Native scope</text>
  </g>
</svg>
